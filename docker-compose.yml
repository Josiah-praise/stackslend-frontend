version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_NAME=StacksLend
      - NEXT_PUBLIC_STACKS_NETWORK=mainnet
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped